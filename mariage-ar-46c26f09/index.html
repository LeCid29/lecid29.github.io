<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anita &amp; Roméo – Plan de table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6faf7;--card:#fff;--ink:#17261e;--mute:#68786e;--line:#dbe6de;--acc:#1f4d36;--acc2:#e3f0e8;--acc3:#2d6a4a;--warn:#b4472f;--warnbg:#fbe9e4;--ok:#1f7a4a;--okbg:#dff3e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}
body{padding-top:env(safe-area-inset-top);min-height:100vh}
header{padding:18px 18px 14px;text-align:center;background:var(--acc);color:#fff;border-radius:0 0 26px 26px}
header h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;letter-spacing:.5px}
header p{margin:0;font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 4px 9px;font:inherit;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc3)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
.big{font-size:19px;padding:16px;border-radius:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--mute);margin-top:2px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--acc2);color:var(--acc);white-space:nowrap}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.tablebox{text-align:center;background:var(--acc);color:#fff;border-radius:14px;padding:12px 10px;margin-top:12px}
.tablebox small{display:block;font-size:12px;opacity:.8;letter-spacing:1.5px;text-transform:uppercase}
.tablebox b{font-family:'Cormorant Garamond',Georgia,serif;font-size:36px;line-height:1.1;letter-spacing:1px}
.tablebox.none{background:var(--warnbg);color:var(--warn)}
.tablebox.none b{font-size:22px;font-family:Inter,sans-serif;letter-spacing:0}
button.btn,label.btn{display:block;text-align:center;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
button.btn.alt,label.btn.alt{background:var(--acc2);color:var(--acc)}
button.btn.ghost{background:none;color:var(--mute);border:1.5px solid var(--line)}
button.btn.danger{background:var(--warnbg);color:var(--warn)}
.btn.full{width:100%;margin-top:10px}
.scan{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 2px;padding:15px}
.scan svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;color:var(--mute);cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--acc3)}
.bar i.over{background:var(--warn)}
.hint{text-align:center;color:var(--mute);font-size:14px;padding:22px 10px;line-height:1.55}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-family:'Cormorant Garamond',Georgia,serif;color:var(--acc)}
.stat span{font-size:12px;color:var(--mute)}
h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;margin:22px 0 4px;color:var(--acc)}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc3);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;z-index:4}
.ov{position:fixed;inset:0;background:rgba(10,25,16,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-family:'Cormorant Garamond',Georgia,serif;font-size:25px;color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--warn);font-size:14px;margin-top:10px}
.testbar{background:#f5c542;color:#4a3a00;text-align:center;font-weight:600;font-size:13px;padding:8px 12px}
.tablebox.grey{background:#6b7570}
.tablebox .t2{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:700;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.3);letter-spacing:.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#17261e;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>

function matchGuests(text){
  var n=norm(text);if(!n)return[];
  var words=n.split(/\s+/),n2=n.replace(/^table\s+/,'');
  var tids={};
  tables.forEach(function(t){
    if((/^\d+$/.test(n2)&&String(t.num)===String(+n2))||(n2.length>=3&&norm(t.name).indexOf(n2)>=0)||(n2.length>=4&&t.zone&&norm(t.zone).indexOf(n2)>=0))tids[t.id]=1;
  });
  return sortedGuests(guests.filter(function(g){
    if(tids[g.tableId])return true;
    var hay=norm(g.name);
    return words.every(function(w){return hay.indexOf(w)>=0});
  }));
}

var scanInfo=null,ocrP=null,STOP={mr:1,mme:1,mlle:1,dr:1,invite:1,de:1,la:1,le:1,et:1,du:1};

function getOcr(){
  if(ocrP)return ocrP;

    var wp=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    return window.Tesseract.createWorker('fra',1,{
      workerPath:wp,corePath:absUrl('vendor/'),langPath:absUrl('vendor/'),

    });

  return ocrP;
}
function lev(a,b){
  var m=a.length,n=b.length,p=[],i,j,c;
  for(j=0;j<=n;j++)p[j]=j;
  for(i=1;i<=m;i++){var prev=p[0];p[0]=i;for(j=1;j<=n;j++){var t=p[j];c=a[i-1]===b[j-1]?0:1;p[j]=Math.min(p[j]+1,p[j-1]+1,prev+c);prev=t}}
  return p[n];
}
function toks(s){return norm(s).replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(function(w){return w.length>=2&&/[a-z]/.test(w)&&!STOP[w]})}
function tokScore(g,list){
  var best=0;
  for(var i=0;i<list.length;i++){
    var o=list[i];
    if(g===o){return 1}
    if(g.length<=3||o.length<=2)continue;
    var s=1-lev(g,o)/Math.max(g.length,o.length);
    if(s>=0.75&&s>best)best=s;
  }
  return best;
}
function scanMatch(text){
  var ot=toks(text),scored=[];
  if(!ot.length)return[];
  guests.forEach(function(g){
    var gt=toks(g.name);if(!gt.length)return;
    var sum=0;gt.forEach(function(w){sum+=tokScore(w,ot)});
    var sc=sum/gt.length;
    if(sc>=0.6)scored.push({g:g,s:sc});
  });
  scored.sort(function(a,b){return b.s-a.s});
  if(!scored.length)return[];
  var top=scored[0].s;
  return scored.filter(function(x){return x.s>=top-0.05}).slice(0,6).map(function(x){return x.g.id});
}
function toCanvas(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    img.onload=function(){
      var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c);
    };
    img.src=url;
  });
}
function setStatus(t){var r=$('#results');if(r)r.innerHTML='<div class="hint">'+esc(t)+'</div>'}
function onScan(file){

  setStatus('Chargement du lecteur… (quelques secondes la première fois)');
  toCanvas(file).then(function(c){
    return getOcr().then(function(w){setStatus('Lecture du billet…');return w.recognize(c)});
  }).then(function(r){
    scanBusy=false;
    var text=(r&&r.data&&r.data.text||'').trim();
    scanInfo={text:text,ids:scanMatch(text)};
    var rr=$('#results');if(rr)rr.innerHTML=resultsHtml();

  var h='<input id="gq" type="search" placeholder="Filtrer la liste" autocomplete="off" value="'+esc(gq)+'">'+
    '<div class="chips">'+chips.map(function(c){return '<button data-act="filter" data-f="'+c[0]+'" class="'+(filter===c[0]?'on':'')+'">'+c[1]+'</button>'}).join('')+'</div>';
  if(!guests.length)return h+'<div class="hint">Aucun invité pour le moment.<br>Touchez + pour en ajouter.</div>';
  h+='<div class="sub" style="margin:4px 2px 0">'+plural(f.length,'invité','invités')+'</div>';
  h+=sortedGuests(f).map(function(g){
    var t=tableById(g.tableId);
    return '<div class="card" data-act="edit-g" data-id="'+g.id+'" style="cursor:pointer"><div class="row"><div class="grow"><div class="name">'+esc(g.name)+'</div></div>'+
      (g.arrived?'<span class="badge ok">Arrivé</span>':'')+(t?'<span class="badge">'+esc(t.name)+'</span>':'<span class="badge warn">Non placé</span>')+'</div></div>';
  }).join('');
  return h;
}

/* ---------- tables ---------- */
function viewTables(){
  var all=sortedTables();
  if(!all.length)return '<div class="hint">Aucune table.<br>Touchez + pour en créer une.</div>';
  var zl=(SEED.zones||[]).slice(),ts=all.filter(function(t){return zf==='all'||(zf==='none'?!t.zone:t.zone===zf)});
  var chips=[['all','Toutes ('+all.length+')']].concat(zl.map(function(z){return [z,z+' ('+all.filter(function(t){return t.zone===z}).length+')']}));
  var nz=all.filter(function(t){return !t.zone}).length;if(nz)chips.push(['none','Sans zone ('+nz+')']);
  var head='<div class="chips" style="margin-bottom:4px">'+chips.map(function(c){return '<button data-act="zfilter" data-z="'+esc(c[0])+'" class="'+(zf===c[0]?'on':'')+'">'+esc(c[1])+'</button>'}).join('')+'</div>';
  return head+ts.map(function(t){
    var u=used(t.id),cap=+t.capacity||0,pct=cap?Math.min(100,Math.round(u/cap*100)):0,pres=0;
    guests.forEach(function(g){if(g.tableId===t.id&&g.arrived)pres+=(+g.seats||1)});
    var st=u>cap?'<span class="badge warn">+'+(u-cap)+' en trop</span>':(u===cap?'<span class="badge">Complète</span>':'<span class="badge">'+(cap-u)+' libre'+(cap-u>1?'s':'')+'</span>');
    var h='<div class="card"><div class="row" data-act="toggle-t" data-id="'+t.id+'" style="cursor:pointer"><div class="grow"><div class="name">'+(t.num?'<span style="color:var(--mute);font-weight:500">'+esc(t.num)+' · </span>':'')+esc(t.name)+'</div><div class="sub">'+(t.zone?esc(t.zone)+' · ':'')+u+' / '+cap+' places · '+pres+' arrivé'+(pres>1?'s':'')+'</div></div>'+st+'</div><div class="bar"><i class="'+(u>cap?'over':'')+'" style="width:'+pct+'%"></i></div>';
    if(openTable===t.id){
      var gs=guests.filter(function(g){return g.tableId===t.id}).sort(function(a,b){return String(a.ticket).localeCompare(String(b.ticket),'fr',{numeric:true})});
      h+='<div style="margin-top:10px">'+(gs.length?gs.map(function(g){return '<div class="row" data-act="edit-g" data-id="'+g.id+'" style="padding:9px 0;border-top:1px solid var(--line);cursor:pointer"><div class="grow">'+esc(g.name)+'</div>'+(g.arrived?'<span class="badge ok">Arrivé</span>':'')+'</div>'}).join(''):'<div class="sub">Aucun invité à cette table.</div>')+
        '<button class="btn alt full" data-act="edit-t" data-id="'+t.id+'">Modifier la table</button></div>';
    }
    return h+'</div>';
  }).join('');
}

/* ---------- more ---------- */
function viewMore(){
  var pers=0,arr=0,unp=0;
  guests.forEach(function(g){var s=+g.seats||1;pers+=s;if(g.arrived)arr+=s;if(!tableById(g.tableId))unp++});
  var over=0;tables.forEach(function(t){if(used(t.id)>(+t.capacity||0))over++});
  var h='<div class="stats">'+
   '<div class="stat"><b>'+guests.length+'</b><span>invités</span></div>'+
   '<div class="stat"><b>'+tables.length+'</b><span>tables</span></div>'+
   '<div class="stat"><b>'+arr+' / '+pers+'</b><span>arrivés</span></div>'+
   '<div class="stat"><b>'+(unp+over)+'</b><span>à vérifier (non placés ou tables surchargées)</span></div></div>';
  h+='<div class="sub">Les arrivées et modifications sont enregistrées sur ce téléphone uniquement.</div>';
  h+='<h2>Mode test</h2><div class="sub">Pour essayer l’application sans rien enregistrer : les arrivées marquées pendant le test sont effacées à la sortie.</div><button class="btn '+(testMode?'':'alt ')+'full" data-act="test">'+(testMode?'Quitter le mode test':'Activer le mode test')+'</button>';
  h+='<h2>Exporter</h2><div class="sub">Copiez la liste complète ou téléchargez-la en CSV.</div>'+
    '<div class="row" style="margin-top:10px"><button class="btn alt grow" data-act="copy-csv">Copier</button><button class="btn alt grow" data-act="dl-csv">Télécharger</button></div>';
  h+='<h2>Plan d’origine</h2><div class="sub">Efface les arrivées et les modifications faites sur ce téléphone.</div><button class="btn danger full" data-act="reset">Revenir au plan d’origine</button>';
  return h;
}

/* ---------- modals ---------- */
function openModal(html){$('#modal').innerHTML='<div class="ov" data-act="ov"><div class="sheet" role="dialog">'+html+'</div></div>'}
function closeModal(){$('#modal').innerHTML=''}
function tableOptions(sel,exceptGuest){
  var o='<option value="">Non placé</option>';
  sortedTables().forEach(function(t){
    var left=(+t.capacity||0)-used(t.id,exceptGuest);
    o+='<option value="'+t.id+'"'+(sel===t.id?' selected':'')+'>'+esc(tLabel(t))+' — '+(left>0?plural(left,'place libre','places libres'):'complète')+'</option>';
  });
  return o;
}
function guestModal(id){
  var g=id?guestById(id):null,isNew=!g;
  g=g||{name:'',ticket:'',seats:1,tableId:'',note:''};
  openModal('<h3>'+(isNew?'Nouvel invité':'Modifier l’invité')+'</h3><form id="gform" data-id="'+(isNew?'':g.id)+'" autocomplete="off">'+
   '<label>Nom de l’invité</label><input name="name" required value="'+esc(g.name)+'">'+
   '<label>Nombre de places</label><input name="seats" type="number" min="1" max="30" value="'+(+g.seats||1)+'">'+
   '<label>Table</label><select name="tableId">'+tableOptions(g.tableId,g.id)+'</select>'+
   '<label>Note (facultatif)</label><input name="note" value="'+esc(g.note||'')+'">'+
   '<div class="err" id="gerr"></div>'+
   '<button class="btn full" type="submit">Enregistrer</button>'+
   (isNew?'':'<button class="btn danger full" type="button" data-act="del-g">Supprimer l’invité</button>')+
   '<button class="btn ghost full" type="button" data-act="close">Annuler</button></form>');
}
function tableModal(id){
  var t=id?tableById(id):null,isNew=!t;
  t=t||{name:'',capacity:10,num:''};
  openModal('<h3>'+(isNew?'Nouvelle table':'Modifier la table')+'</h3><form id="tform" data-id="'+(isNew?'':t.id)+'" autocomplete="off">'+
   '<div class="two"><div><label>N° (facultatif)</label><input name="num" type="number" min="1" value="'+esc(t.num||'')+'"></div>'+
   '<div><label>Places</label><input name="capacity" type="number" min="1" max="100" value="'+(+t.capacity||10)+'"></div></div>'+
   '<label>Nom de la table</label><input name="name" required value="'+esc(t.name)+'">'+
   '<label>Zone</label><select name="zone"><option value="">Aucune zone</option>'+(SEED.zones||[]).map(function(z){return '<option'+(t.zone===z?' selected':'')+'>'+esc(z)+'</option>'}).join('')+'</select>'+
   '<div class="err" id="terr"></div><button class="btn full" type="submit">Enregistrer</button>'+
   (isNew?'':'<button class="btn danger full" type="button" data-act="del-t">Supprimer la table</button>')+
   '<button class="btn ghost full" type="button" data-act="close">Annuler</button></form>');
}

/* ---------- csv ---------- */
function csvCell(s){s=String(s==null?'':s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function toCsv(){
  var rows=['Nom;Zone;Table N°;Table;Arrivé'];
  sortedGuests(guests).forEach(function(g){var t=tableById(g.tableId);rows.push([g.name,t?t.zone||'':'',t?t.num||'':'',t?t.name:'',g.arrived?'oui':'non'].map(csvCell).join(';'))});
  return rows.join('\n');
}
function showCsv(csv){
  openModal('<h3>Liste complète</h3><div class="sub">Sélectionnez tout et copiez le texte ci-dessous.</div><textarea id="csvout" readonly style="min-height:220px;margin-top:10px">'+esc(csv)+'</textarea><button class="btn full" data-act="close">Fermer</button>');
  var t=$('#csvout');if(t){t.focus();t.select()}
}

/* ---------- events ---------- */
document.addEventListener('input',function(e){
  if(e.target.id==='q'){q=e.target.value;scanInfo=null;var r=$('#results');if(r)r.innerHTML=resultsHtml()}
  else if(e.target.id==='gq'){gq=e.target.value;render()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='scanfile'){var f=e.target.files&&e.target.files[0];e.target.value='';onScan(f)}
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.dataset.act,id=el.dataset.id;
  if(act==='ov'){if(e.target===el)closeModal();return}
  if(act==='tab'){view=el.dataset.v;render();window.scrollTo(0,0)}
  else if(act==='filter'){filter=el.dataset.f;render()}
  else if(act==='new-g')guestModal(null);
  else if(act==='edit-g')guestModal(id);
  else if(act==='new-t')tableModal(null);
  else if(act==='edit-t')tableModal(id);
  else if(act==='zfilter'){zf=el.dataset.z;render()}
  else if(act==='toggle-t'){openTable=openTable===id?null:id;render()}
  else if(act==='close')closeModal();
  else if(act==='arrive'){var g=guestById(id);if(g){g.arrived=!g.arrived;g.arrivedAt=g.arrived?new Date().toISOString():'';put('g',g);render();toast(g.arrived?g.name+' : arrivé(e)':'Arrivée annulée')}}
  else if(act==='del-g'){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Confirmer la suppression';return}
    del('g',$('#gform').dataset.id);closeModal();render();toast('Invité supprimé');
  }
  else if(act==='del-t'){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Confirmer (les invités seront désassignés)';return}
    var tid=$('#tform').dataset.id;
    guests.filter(function(g){return g.tableId===tid}).forEach(function(g){g.tableId='';put('g',g)});
    del('t',tid);closeModal();render();toast('Table supprimée');
  }
  else if(act==='copy-csv'){
    var csv=toCsv(),ok=false;
    try{navigator.clipboard.writeText(csv).then(function(){toast('Liste copiée')},function(){showCsv(csv)});ok=true}catch(x){}
    if(!ok)showCsv(csv);
  }
  else if(act==='dl-csv'){
    var csv2=toCsv();
    if(window.claude&&window.claude.use){
      window.claude.use('downloads').then(function(d){
        if(!d){showCsv(csv2);return}
        return d.save({filename:'invites-anita-romeo.csv',data:'﻿'+csv2}).catch(function(){})
      }).catch(function(){showCsv(csv2)});
    }else showCsv(csv2);
  }
  else if(act==='test'){
    if(!testMode){testSnap=JSON.stringify({g:guests,t:tables});testMode=true;toast('Mode test activé : rien n’est enregistré')}
    else{var o=JSON.parse(testSnap);guests=o.g;tables=o.t;testMode=false;testSnap=null;save();toast('Mode test terminé : données d’origine rétablies')}
    render();
  }
  else if(act==='reset'){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Confirmer : tout remettre à zéro';return}
    loadSeed();save();render();toast('Plan d’origine restauré');
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,d=new FormData(f);
  if(f.id==='gform'){
    var id=f.dataset.id,name=String(d.get('name')).trim(),tk='',seats=Math.max(1,parseInt(d.get('seats'),10)||1),err=$('#gerr');
    if(!name){err.textContent='Le nom est obligatoire.';return}
    var old=id?guestById(id):null;if(old)tk=old.ticket||'';
    var tid=String(d.get('tableId')||'');
    var g={id:id||uid('g'),name:name,ticket:tk,seats:seats,tableId:tid,note:String(d.get('note')||'').trim(),arrived:old?!!old.arrived:false,arrivedAt:old&&old.arrivedAt||''};
    put('g',g);closeModal();render();
    var t=tableById(tid);
    toast(t&&used(tid)>(+t.capacity||0)?t.name+' est maintenant surchargée':'Invité enregistré');
  }else if(f.id==='tform'){
    var tid2=f.dataset.id,nm=String(d.get('name')).trim(),cap=Math.max(1,parseInt(d.get('capacity'),10)||1),num=parseInt(d.get('num'),10)||'',er=$('#terr');
    if(!nm){er.textContent='Donnez un nom à la table.';return}
    if(tables.some(function(t){return t.id!==tid2&&norm(t.name)===norm(nm)})){er.textContent='Une table porte déjà ce nom.';return}
    put('t',{id:tid2||uid('t'),name:nm,capacity:cap,num:num,zone:String(d.get('zone')||'')});closeModal();render();toast('Table enregistrée');
  }
});

/* ---------- start ---------- */
load();render();
})();
</script>
</body>
</html>
