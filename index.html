/* 2 Odds — layout : feuille de match mobile — en-tête défilant (marque + mises à jour), barre collante d'onglets et de filtres, cartes empilées, fiche détaillée plein écran */
:root {
  --bg: #eef2ee; --surface: #ffffff; --surface-2: #f6f8f5; --ink: #142019; --muted: #5b6a61; --line: #d8e0d9;
  --pitch: #00824a; --pitch-soft: #dcf3e6; --home: #00824a; --draw: #a7b2aa; --away: #2c4f86;
  --yellow: #e2b100; --warn: #b0541a; --warn-soft: #fbeadf; --live: #c62f2f; --live-soft: #fbe4e2;
  --shadow: 0 1px 2px rgba(20, 32, 25, .06), 0 4px 14px rgba(20, 32, 25, .05);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1310; --surface: #141e19; --surface-2: #19251f; --ink: #e4ece7; --muted: #92a299; --line: #26352d;
    --pitch: #00c46a; --pitch-soft: #0f2c1e; --home: #00c46a; --draw: #56645b; --away: #86a9e6; --yellow: #f0c430;
    --warn: #f0a070; --warn-soft: #3a2418; --live: #ff7a6e; --live-soft: #3b1d1b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1310; --surface: #141e19; --surface-2: #19251f; --ink: #e4ece7; --muted: #92a299; --line: #26352d;
  --pitch: #00c46a; --pitch-soft: #0f2c1e; --home: #00c46a; --draw: #56645b; --away: #86a9e6; --yellow: #f0c430;
  --warn: #f0a070; --warn-soft: #3a2418; --live: #ff7a6e; --live-soft: #3b1d1b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* En-tête */
.head .wrap { padding-block: 14px 8px; display: grid; gap: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 44px; height: 44px; border-radius: 11px; flex: none; display: block; background: #000; border: 1px solid var(--line); }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 27px; line-height: 1; text-transform: uppercase; white-space: nowrap; }
.brand h1 span { color: var(--pitch); }
.brand small { color: var(--muted); font-size: 12px; line-height: 1.25; text-align: right; min-width: 0; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.act { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 10px; font-family: var(--font-display); font-weight: 600; font-size: 15.5px; letter-spacing: .02em; cursor: pointer; white-space: nowrap; }
.act.livebtn { border-color: color-mix(in srgb, var(--live) 45%, var(--line)); }
.act .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
.act svg { width: 15px; height: 15px; }
.act:disabled { opacity: .55; cursor: default; }
.updline { font-size: 12.5px; color: var(--muted); }
.updline:empty { display: none; }
.updline b { color: var(--ink); font-weight: 600; }
.updline.err { color: var(--warn); }

.bar-sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-sticky .wrap { padding-block: 8px; display: grid; gap: 8px; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { flex: 1 1 auto; border: 0; background: transparent; padding: 7px 5px; border-radius: 8px; font-family: var(--font-display); font-weight: 600; font-size: clamp(13px, 3.9vw, 15px); letter-spacing: .02em; text-transform: uppercase; cursor: pointer; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tabs .lv { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-left: 4px; vertical-align: 2px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 1px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-family: var(--font-display); font-weight: 600; font-size: 14.5px; letter-spacing: .02em; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips.sub .chip { font-size: 13.5px; padding: 4px 10px; }

main { padding-block: 14px 40px; display: grid; gap: 16px; }
.day { display: grid; gap: 10px; }
.day h2, .sect-title { margin: 6px 2px 0; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.intro { color: var(--muted); font-size: 14px; margin: 0 2px; max-width: 62ch; }

/* Cartes match */
.match { display: grid; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow); }
.match:hover { border-color: color-mix(in srgb, var(--pitch) 40%, var(--line)); }
:focus-visible { outline: 2px solid var(--pitch); outline-offset: 2px; }
.mhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; min-width: 0; }
.mhead .left { display: flex; gap: 8px; align-items: center; min-width: 0; }
.tag { font-family: var(--font-display); font-weight: 600; letter-spacing: .06em; font-size: 12px; text-transform: uppercase; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.tag.livetag { color: var(--live); border-color: color-mix(in srgb, var(--live) 50%, var(--line)); }
.time { font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
.sub-tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mbody { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.teams { display: grid; gap: 2px; min-width: 0; }
.team { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick { display: grid; justify-items: end; gap: 2px; }
.pick b { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; background: var(--pitch-soft); color: var(--pitch); border-radius: 8px; padding: 4px 9px; min-width: 44px; text-align: center; }
.pick span { font-size: 12px; color: var(--muted); }
.score-live { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; }
.bar { display: grid; gap: 4px; }
.bar-labels { display: flex; justify-content: space-between; font-family: var(--font-display); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.bar-track { display: flex; height: 8px; border-radius: 99px; overflow: hidden; gap: 2px; }
.bar-track i { display: block; height: 100%; }
.b1 { background: var(--home); } .bn { background: var(--draw); } .b2 { background: var(--away); }
.mfoot { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 13px; }
.mfoot b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.flag { color: var(--warn); font-weight: 600; }
.comment { font-size: 14px; border-left: 3px solid var(--live); padding-left: 10px; color: var(--ink); }

/* Combinés */
.combo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.combo-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: end; padding: 14px; background: var(--pitch-soft); }
.combo-head .eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--pitch); }
.combo-head h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.05; }
.combo-head .odds { text-align: right; font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.combo-head .odds small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 3px; }
.combo-head .pass { grid-column: 1 / -1; font-size: 14px; color: var(--ink); }
.combo.live .combo-head { background: var(--live-soft); }
.combo.live .combo-head .eyebrow { color: var(--live); }
.legs { list-style: none; margin: 0; padding: 0; }
.leg { padding: 12px 14px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.leg-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; }
.leg-ctx { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.leg-match { font-weight: 600; font-size: 15px; }
.leg-pick { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--pitch); line-height: 1.15; }
.leg-p { text-align: right; }
.leg-p strong { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.leg-p small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.why { font-size: 13.5px; color: var(--muted); max-width: 64ch; }
.why b { color: var(--ink); font-weight: 600; }
.open-link { justify-self: start; border: 0; background: none; padding: 0; color: var(--pitch); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
details.ana { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-top: 2px; }
details.ana summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--ink); }
.ana-row { display: grid; gap: 1px; margin-top: 7px; }
.ana-k { font-size: 12px; font-weight: 700; color: var(--ink); letter-spacing: .01em; }
.ana-v { font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.ana-why .ana-v { color: var(--ink); }
.ana-lead { border-left: 3px solid var(--pitch); padding: 1px 0 1px 10px; display: grid; gap: 2px; }
.ana-lead .ana-v { margin: 0; color: var(--ink); }
.anacard .ana-row:first-of-type { margin-top: 2px; }
.syn { margin: 8px 0 0; font-size: 13.5px; color: var(--ink); }
.stk-head { font-size: 13.5px; margin: 8px 0 2px; }
.stk-opt { border-top: 1px solid var(--line); padding: 9px 0 3px; display: grid; gap: 5px; }
.stk-opt:first-of-type { border-top: 0; }
.stk-h { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-weight: 700; font-size: 14.5px; }
.stk-tag { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; border-radius: 999px; padding: 1px 8px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.stk-tag.min { background: var(--pitch-soft); color: var(--pitch); border-color: transparent; }
.stk-bets { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stk-bets b { color: var(--ink); font-weight: 600; }
.stk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.stk-grid > div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; display: grid; min-width: 0; }
.stk-grid .k { font-size: 11.5px; color: var(--muted); line-height: 1.2; }
.stk-grid .v { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stk-grid .o { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cov { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.cov th { text-align: right; font-size: 11.5px; line-height: 1.2; color: var(--muted); font-weight: 600; padding: 4px 3px; vertical-align: bottom; }
.cov td { padding: 6px 3px; border-top: 1px solid var(--line); text-align: right; font-weight: 700; white-space: nowrap; }
.cov th:first-child, .cov td:first-child { text-align: left; padding-left: 0; }
.cov td:first-child { font-weight: 600; white-space: normal; }
.cov td small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.cov tr.hit td { background: var(--pitch-soft); }
.cov tr.hit td:first-child { box-shadow: inset 3px 0 0 var(--pitch); padding-left: 6px; }
.cov tr.off td { opacity: .4; }
.prosline { font-size: 13.5px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
.prosline a { color: var(--pitch); }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stk-grid > div.hit { border: 2px solid var(--pitch); padding: 4px 6px; }
.stk-grid > div.off { opacity: .4; }
.up { color: var(--pitch) !important; }
.dn { color: var(--warn) !important; }
.stk-res { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stk-tip { font-size: 13.5px; color: var(--ink); border-left: 3px solid var(--pitch); padding: 1px 0 1px 10px; margin: 8px 0 0; }
.stk-note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.bkrow { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.bkrow #bk-amt { width: 112px; }
.bkrow select { font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; }
.bkrules { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 13.5px; color: var(--muted); }
.bkrules b { color: var(--ink); font-weight: 600; }
.combo-foot { padding: 10px 14px 14px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }

/* Bilan et historique */
.badge { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 2px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.badge.won { background: var(--pitch-soft); color: var(--pitch); }
.badge.lost { background: var(--warn-soft); color: var(--warn); }
.badge.live { background: var(--live-soft); color: var(--live); }
.badge.pending, .badge.void { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.combo.done-won .combo-head { background: var(--pitch-soft); }
.combo.done-lost .combo-head { background: var(--warn-soft); }
.combo.done-lost .combo-head .eyebrow { color: var(--warn); }
.eyebrow-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.kpi-main { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.kpi-main .big { font-family: var(--font-display); font-weight: 700; font-size: 50px; line-height: 1; color: var(--pitch); font-variant-numeric: tabular-nums; }
.kpi-main .big.none { color: var(--muted); }
.kpi-main .txt { font-size: 14px; }
.kpi-main .txt b { font-weight: 600; }
.kpi-main .txt span { color: var(--muted); }
.hist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.hist-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 11px 14px; }
.hist-head .ttl { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.15; }
.hist-head .meta { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.hleg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 14px; align-items: center; }
.hleg .lb { font-weight: 600; min-width: 0; }
.hleg .mt { grid-column: 1; color: var(--muted); font-size: 12.5px; min-width: 0; }
.hleg .rs { grid-row: 1 / span 2; grid-column: 2; display: grid; justify-items: end; gap: 3px; }
.hleg .rs small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Cotes 1xBet */
.xbline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.xb { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.xb input { width: 78px; font: inherit; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.xb input:focus { outline: 2px solid var(--pitch); outline-offset: 1px; }
.xb input:disabled { opacity: .6; }
.val { display: inline-flex; align-items: center; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 2px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.val.good { background: var(--pitch-soft); color: var(--pitch); }
.val.meh { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.val.bad { background: var(--warn-soft); color: var(--warn); }
.val.gap { background: transparent; color: var(--warn); border: 1px dashed var(--warn); }
.xbauto { font-size: 12.5px; color: var(--muted); }
.xbauto b { color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
.vrow { cursor: pointer; }
.xbsum { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.xbsum b { font-variant-numeric: tabular-nums; }
.row .xbrow { grid-column: 1 / -1; margin-top: -2px; }
.tgcopy { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12.5px; color: var(--muted); }
.tgbtn { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.tgbtn:active { transform: scale(.97); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; max-width: min(92vw, 440px); background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.cpbox { width: 100%; min-height: 72px; font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface-2); color: var(--ink); }
.xbtoggle { justify-self: start; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-family: var(--font-display); font-weight: 600; font-size: 14px; cursor: pointer; }
.xberr { color: var(--warn); font-size: 12.5px; }
.valuelist { display: grid; gap: 8px; }

/* Top */
.toplist { display: grid; gap: 8px; }
.pickrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 14px; cursor: pointer; }
.pickrow .what { font-weight: 600; font-size: 15.5px; min-width: 0; }
.pickrow .vs, .pickrow .ctx { grid-column: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pickrow .ctx { color: var(--muted); }
.pickrow .pp { grid-row: 1 / span 3; grid-column: 2; text-align: right; }
.pp strong { display: block; font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.pp small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.conf { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.conf::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--pitch); }
.conf.c-bonne::before { background: var(--pitch); }
.conf.c-moyenne::before { background: linear-gradient(90deg, var(--pitch) 50%, transparent 50%); }

/* États */
.state { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; color: var(--muted); display: grid; gap: 6px; }
.state strong { color: var(--ink); font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.skel { height: 118px; border-radius: var(--r); background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; border: 1px solid var(--line); animation: sh 1.4s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }
.livehead { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; }
.livehead .when { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--live); }

/* Pied de page */
.foot { display: grid; gap: 10px; color: var(--muted); font-size: 13px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--ink); letter-spacing: .02em; }
details p { margin: 8px 0 0; max-width: 64ch; }
.legal { border-left: 3px solid var(--yellow); padding-left: 10px; margin: 0; }

/* Fiche */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.sheet-in { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.close { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-family: var(--font-display); font-weight: 600; font-size: 15px; cursor: pointer; }
.versus { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; text-align: center; }
.versus h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(16px, 4.6vw, 28px); line-height: 1.08; text-transform: uppercase; text-wrap: balance; word-break: normal; overflow-wrap: break-word; }
.versus .xg { font-family: var(--font-display); font-size: 23px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.versus .xg small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.card p { margin: 0; }
.ycard { width: 10px; height: 14px; background: var(--yellow); border-radius: 2px; display: inline-block; }
.mainpick { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--pitch-soft); border-color: transparent; }
.mainpick .code { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; color: var(--pitch); min-width: 54px; text-align: center; }
.mainpick .lbl { font-weight: 600; font-size: 17px; }
.mainpick .sub { color: var(--muted); font-size: 13px; }
.mainpick .big { font-family: var(--font-display); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; text-align: right; line-height: 1; }
.mainpick .big small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; font-family: var(--font-body); margin-top: 4px; }
.notebox { display: grid; gap: 8px; }
.abs { display: flex; flex-wrap: wrap; gap: 6px; }
.abs span { background: var(--warn-soft); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.sq { margin: 8px 0 0; font-size: 13.5px; }
.sq p { margin: 2px 0; }
.src { font-size: 12px; color: var(--muted); }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 48px 64px; gap: 10px; align-items: center; font-size: 14px; }
.row .meter { grid-column: 1 / -1; height: 5px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: -4px; }
.row .meter i { display: block; height: 100%; background: var(--pitch); border-radius: 99px; }
.row .p { font-family: var(--font-display); font-weight: 700; font-size: 18px; text-align: right; font-variant-numeric: tabular-nums; }
.row .od { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.scores { display: flex; flex-wrap: wrap; gap: 8px; }
.score { background: var(--surface-2); border-radius: 10px; padding: 7px 10px; display: grid; justify-items: center; min-width: 62px; }
.score b { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1; }
.score span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: end; text-align: center; }
.split .side { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.split .val { font-family: var(--font-display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1; }
.split .tot { background: var(--surface-2); border-radius: 10px; padding: 6px 12px; }
.note { font-size: 12px; color: var(--muted); }
.form { display: grid; gap: 8px; }
.form-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.form-line .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pills { display: flex; gap: 4px; }
.pill { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.pill.V { background: var(--home); color: var(--surface); } .pill.N { background: var(--draw); color: var(--ink); } .pill.D { background: var(--warn); color: var(--surface); }
.calgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 760px) { .calgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.cal { display: grid; gap: 6px; min-width: 0; }
.cal-h { display: grid; gap: 1px; min-width: 0; }
.cal-h b { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-h span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal-m { font-size: 12.5px; font-weight: 600; color: var(--muted); text-transform: capitalize; margin-top: 2px; }
.cal-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; padding-bottom: 1px; }
.calday { min-height: 40px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); display: grid; place-content: center; justify-items: center; gap: 1px; padding: 2px 0; font: inherit; line-height: 1; }
button.calday { cursor: pointer; }
.calday .d { font-family: var(--font-display); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.calday .o { font-size: 10px; font-variant-numeric: tabular-nums; }
.calday.w { background: var(--pitch); color: var(--bg); }
.calday.l { background: var(--live); color: var(--bg); }
.calday.p { border: 1px dashed var(--muted); color: var(--ink); }
.calday.lv { border: 2px solid var(--yellow); color: var(--ink); }
.calday.n, .calday.v { background: var(--surface-2); border-color: var(--line); }
.calday.x { opacity: .4; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.cal-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1px solid transparent; }
.hist { scroll-margin-top: 140px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cell { background: var(--surface-2); border-radius: 10px; padding: 9px 8px; text-align: center; display: grid; gap: 2px; }
.cell .k { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .v { font-family: var(--font-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.cell .o { font-size: 12px; color: var(--muted); }
.warnbox { background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 9px 11px; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>

<script>
/* Pronos Big 5 — modèle statistique (pur JS, sans dépendance).
   Buts : Poisson attaque/défense + avantage du terrain, rétrécissement vers la moyenne,

(function (root) {
  "use strict";

  var HALF_LIFE_DAYS = 120;

    var home = Math.log(Math.max(0.05, sumH / sw)) - Math.log(Math.max(0.05, sumA / sw));

    var inv = 1 / (sigma * sigma);
    var lh = new Array(n), la = new Array(n);

      for (var k = 0; k < n; k++) {

        la[k] = Math.exp(mu + att[r.a] + def[r.h]);

      lam();
      var g = 0, H = 0;
      for (i = 0; i < n; i++) { g += w[i] * (rows[i].yh - lh[i] + rows[i].ya - la[i]); H += w[i] * (lh[i] + la[i]); }
      mu += g / H;
      lam();
      g = 0; H = 0;
      for (i = 0; i < n; i++) { g += w[i] * (rows[i].yh - lh[i]); H += w[i] * lh[i]; }
      // léger rappel de l'avantage du terrain vers +0,15 (valeur typique en Europe)
      g -= (home - 0.15) * 8; H += 8;
      home += g / H;
      lam();
      for (t = 0; t < teams.length; t++) {
        var c = teams[t], ga = -(att[c] - a0[c]) * inv, Ha = inv, gd = -(def[c] - d0[c]) * inv, Hd = inv;
        for (i = 0; i < n; i++) {
          var r = rows[i];
          if (r.h === c) { ga += w[i] * (r.yh - lh[i]); Ha += w[i] * lh[i]; gd += w[i] * (r.ya - la[i]); Hd += w[i] * la[i]; }
          else if (r.a === c) { ga += w[i] * (r.ya - la[i]); Ha += w[i] * la[i]; gd += w[i] * (r.yh - lh[i]); Hd += w[i] * lh[i]; }

      ma /= teams.length; md /= teams.length;

        else if (x === 0 && y === 1) tau = 1 + lh * RHO;
        else if (x === 1 && y === 0) tau = 1 + la * RHO;
        else if (x === 1 && y === 1) tau = 1 - RHO;

  }

  function marketsFromMatrix(M) {
    var p1 = 0, pn = 0, p2 = 0, o15 = 0, o25 = 0, o35 = 0, btts = 0, scores = [], x, y;
    for (x = 0; x <= MAXG; x++) for (y = 0; y <= MAXG; y++) {
      var v = M[x][y];
      if (x > y) p1 += v; else if (x === y) pn += v; else p2 += v;
      if (x + y > 1.5) o15 += v;
      if (x + y > 2.5) o25 += v;
      if (x + y > 3.5) o35 += v;
      if (x > 0 && y > 0) btts += v;
      scores.push({ s: x + "-" + y, p: v });
    }
    scores.sort(function (a, b) { return b.p - a.p; });
    return { p1: p1, pn: pn, p2: p2, o15: o15, o25: o25, o35: o35, btts: btts, top: scores.slice(0, 5) };
  }

  function form(results, team, n) {
    var out = [];
    for (var i = results.length - 1; i >= 0 && out.length < n; i--) {
      var r = results[i], gf, ga, opp, venue;
      if (r[1] === team) { gf = r[3]; ga = r[4]; opp = r[2]; venue = "D"; }
      else if (r[2] === team) { gf = r[4]; ga = r[3]; opp = r[1]; venue = "E"; }
      else continue;
      out.push({ res: gf > ga ? "V" : gf === ga ? "N" : "D", gf: gf, ga: ga, opp: opp, venue: venue, date: r[0] });
    }
    return out;
  }

    var c = 0;
    rows.forEach(function (r) { if (r.h === team || r.a === team) c++; });
    return c;
  }

  function linesAround(mean, step) {
    var base = Math.round(mean) - 0.5;
    return [base - step, base, base + step];
  }

  function buildLeague(doc, refDate) {
    var teams = Object.keys(doc.teams);
    refDate = refDate || doc.updatedAt || new Date().toISOString();
    var goalRows = doc.results.map(function (r) { return { date: r[0], h: r[1], a: r[2], yh: r[3], ya: r[4] }; });
    var st = doc.stats || [];
    function statRows(ih, ia) {
      return st.map(function (s) { return { date: s[1], h: s[2], a: s[3], yh: s[ih], ya: s[ia] }; });

    // over / under = lignes affichées, en pas (step) autour de la ligne centrale (moyenne arrondie - 0,5)

      teams: teams,
      goalSample: function (c) { return teamCount(goalRows, c); },
      predict: function (h, a) {
        var e = G.expect(h, a);
        var M = scoreMatrix(e[0], e[1]);
        var mk = marketsFromMatrix(M);

        return {
          goals: mk,
          // corners : écart à la moyenne réduit de 60 % et dispersion élargie (test à l'aveugle 2024-25 et 2025-26 :
          // sans cela le modèle annonçait 76 % là où 66 % passaient) ; cartons : modèle déjà juste, inchangé
          corners: countBlock(C, cRows, h, a, 1, { shrink: 0.4, kmul: 0.7, over: [-3, -2, -1, 0, 1], under: [3] }),
          cards: countBlock(Y, yRows, h, a, 1, { over: [-1, 0, 1], under: [2] }),
          fouls: countBlock(F, fRows, h, a, 2),
          formHome: form(doc.results, h, 5),
          formAway: form(doc.results, a, 5),
          sampleGoals: Math.min(teamCount(goalRows, h), teamCount(goalRows, a))
        };
      },
      homeAdv: G.home

  }

  // Sélection des pronostics : marchés classés par probabilité, avec cote juste (1/p)
  function picks(pred, names) {
    var g = pred.goals, H = names[0], A = names[1], list = [];
    function add(label, p, group) { list.push({ label: label, p: p, odds: 1 / p, group: group }); }
    add("Victoire " + H, g.p1, "1N2");
    add("Match nul", g.pn, "1N2");
    add("Victoire " + A, g.p2, "1N2");
    add(H + " ou nul", g.dc1n, "DC");
    add(A + " ou nul", g.dcn2, "DC");
    add("Pas de match nul", g.dc12, "DC");
    add("Plus de 1,5 but", g.o15, "OU");
    add("Plus de 2,5 buts", g.o25, "OU");
    add("Moins de 2,5 buts", 1 - g.o25, "OU");
    add("Moins de 3,5 buts", 1 - g.o35, "OU");
    add("Les deux équipes marquent", g.btts, "BTTS");
    add("Une équipe au moins ne marque pas", 1 - g.btts, "BTTS");
    // pronostic principal 1N2 / double chance
    var main;
    if (g.p1 >= 0.5) main = { code: "1", label: "Victoire " + H, p: g.p1 };
    else if (g.p2 >= 0.5) main = { code: "2", label: "Victoire " + A, p: g.p2 };
    else if (g.dc1n >= 0.7 && g.dc1n >= g.dcn2) main = { code: "1N", label: H + " ou nul", p: g.dc1n };
    else if (g.dcn2 >= 0.7) main = { code: "N2", label: A + " ou nul", p: g.dcn2 };
    else if (g.dc12 >= 0.76) main = { code: "12", label: "Pas de match nul", p: g.dc12 };
    else {
      var best = [["1", "Victoire " + H, g.p1], ["N", "Match nul", g.pn], ["2", "Victoire " + A, g.p2]].sort(function (a, b) { return b[2] - a[2]; })[0];
      main = { code: best[0], label: best[1], p: best[2] };
    }
    var goals = g.o25 >= 0.5 ? { label: "+2,5 buts", p: g.o25 } : { label: "−2,5 buts", p: 1 - g.o25 };
    var btts = g.btts >= 0.5 ? { label: "Les deux marquent", p: g.btts } : { label: "Pas les deux", p: 1 - g.btts };
    var safest = list.filter(function (x) { return x.p <= 0.9; }).sort(function (a, b) { return b.p - a.p; }).slice(0, 3);
    return { main: main, goals: goals, btts: btts, all: list, safest: safest };
  }

  function confidence(p) {
    if (p >= 0.7) return "élevée";
    if (p >= 0.58) return "moyenne";
    return "faible";
  }

  var api = { fitCounts: fitCounts, setSigma: function (v) { SIGMA_PRIOR = v; }, buildLeague: buildLeague, picks: picks, confidence: confidence, nbOver: nbOver, scoreMatrix: scoreMatrix };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.PronoModel = api;
})(this);

</script>
<script>
/* Pronos Big 5 — modèles multisports, live et combinés (pur JS).
   S'appuie sur PronoModel (football Big 5) défini dans model.js. */
(function (root) {
  "use strict";
  var PM = (typeof module !== "undefined" && module.exports) ? require("./model.js") : root.PronoModel;

  // ---------- outils ----------
  function erf(x) {
    var s = x < 0 ? -1 : 1; x = Math.abs(x);
    var t = 1 / (1 + 0.3275911 * x);
    var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return s * y;
  }
  function Phi(z) { return 0.5 * (1 + erf(z / Math.SQRT2)); }
  function invPhi(p) {
    p = Math.min(0.999, Math.max(0.001, p));
    var lo = -6, hi = 6;
    for (var i = 0; i < 60; i++) { var m = (lo + hi) / 2; if (Phi(m) < p) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  function pois(l, max) { var p = [Math.exp(-l)]; for (var x = 1; x <= max; x++) p.push(p[x - 1] * l / x); return p; }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

  function fr(x) { return String(x).replace(".", ","); }

  // ---------- football : buts attendus implicites à partir des probabilités 1N2 ----------
  function impliedGoals(p1, pn, p2) {
    var best = null;
    function err(T, s) {
      var g = goalsMarkets(T * s, T * (1 - s));
      return Math.pow(g.p1 - p1, 2) + Math.pow(g.pn - pn, 2) + Math.pow(g.p2 - p2, 2);
    }
    for (var T = 1.4; T <= 4.2; T += 0.1) for (var s = 0.12; s <= 0.88; s += 0.02) {
      var e = err(T, s);
      if (!best || e < best.e) best = { e: e, T: T, s: s };
    }
    // affinage local
    var step = [0.05, 0.01];
    for (var k = 0; k < 30; k++) {
      var improved = false;
      [[step[0], 0], [-step[0], 0], [0, step[1]], [0, -step[1]]].forEach(function (d) {
        var T2 = best.T + d[0], s2 = clamp(best.s + d[1], 0.05, 0.95);
        if (T2 < 1) return;
        var e2 = err(T2, s2);
        if (e2 < best.e) { best = { e: e2, T: T2, s: s2 }; improved = true; }
      });
      if (!improved) { step[0] /= 2; step[1] /= 2; }
    }
    return [best.T * best.s, best.T * (1 - best.s)];
  }

  function goalsMarkets(lh, la) {
    var M = PM.scoreMatrix(lh, la), p1 = 0, pn = 0, p2 = 0, o15 = 0, o25 = 0, o35 = 0, btts = 0, scores = [];
    for (var x = 0; x < M.length; x++) for (var y = 0; y < M.length; y++) {
      var v = M[x][y];
      if (x > y) p1 += v; else if (x === y) pn += v; else p2 += v;
      if (x + y > 1.5) o15 += v; if (x + y > 2.5) o25 += v; if (x + y > 3.5) o35 += v;
      if (x > 0 && y > 0) btts += v;
      scores.push({ s: x + "-" + y, p: v });
    }
    scores.sort(function (a, b) { return b.p - a.p; });
    return { p1: p1, pn: pn, p2: p2, o15: o15, o25: o25, o35: o35, btts: btts, top: scores.slice(0, 5), xgHome: lh, xgAway: la, dc1n: p1 + pn, dc12: p1 + p2, dcn2: pn + p2 };
  }

  // Recalage des probabilités du modèle football (5 grands championnats), mesuré sur 2024-25 et 2025-26 :
  // le modèle était trop sûr de lui sur les buts (plus/moins) et « les deux équipes marquent », un peu trop
  // prudent sur le résultat. p' = 1 / (1 + exp(-(a + b·logit p))).
  var FOOT_CAL = { res: [0, 1], tot: [0.0862, 0.8257], btts: [0.0344, 0.4359] };

    o.o15 = calP(FOOT_CAL.tot, g.o15); o.o25 = calP(FOOT_CAL.tot, g.o25); o.o35 = calP(FOOT_CAL.tot, g.o35);
    o.btts = calP(FOOT_CAL.btts, g.btts); o.calibrated = true;

  }

  function footballMarkets(g, H, A) {
    return [
      { id: "1", label: "Victoire " + H, p: g.p1, grp: "res", rule: { t: "res", s: "1" } },
      { id: "N", label: "Match nul", p: g.pn, grp: "res", rule: { t: "res", s: "N" } },
      { id: "2", label: "Victoire " + A, p: g.p2, grp: "res", rule: { t: "res", s: "2" } },
      { id: "1N", label: H + " ou nul", p: g.dc1n, grp: "dc", rule: { t: "res", s: "1N" } },
      { id: "N2", label: A + " ou nul", p: g.dcn2, grp: "dc", rule: { t: "res", s: "N2" } },
      { id: "12", label: "Pas de match nul", p: g.dc12, grp: "dc", rule: { t: "res", s: "12" } },
      { id: "o15", label: "Plus de 1,5 but", p: g.o15, grp: "tot", rule: { t: "tot", o: 1, l: 1.5 } },
      { id: "o25", label: "Plus de 2,5 buts", p: g.o25, grp: "tot", rule: { t: "tot", o: 1, l: 2.5 } },

  // ---------- hockey / baseball : Poisson calé sur la probabilité de victoire ----------
  function poisWin(lh, la, max, otShareHome) {

  // NHL : score des 60 minutes « avant fin de match » (Poisson), puis fin de match calée sur la saison 2025-26

  var NHL = { pre: 0.9155, c1: 0.2468, a1: 0.2184, a2: 0.4125, c2: 0.0552, a3: 0.1493 };
  function hockeyDist(lh, la) {
    var n = 14, ph = pois(lh, n), pa = pois(la, n), q = lh / (lh + la), F = {}, reg = { h: 0, n: 0, a: 0 };
    function put(x, y, v) { var k = x + ":" + y; F[k] = (F[k] || 0) + v; }
    function tie(x, v) { reg.n += v; put(x + 1, x, v * q); put(x, x + 1, v * (1 - q)); }
    function lead(x, y, v) { if (x > y) reg.h += v; else reg.a += v; put(x, y, v); }
    for (var x = 0; x <= n; x++) for (var y = 0; y <= n; y++) {
      var v = ph[x] * pa[y], m = Math.abs(x - y), hx = x > y;
      if (!v) continue;
      if (m === 0) tie(x, v);
      else if (m === 1) {
        tie(Math.max(x, y), v * NHL.c1);                                         // égalisation gardien retiré
        lead(hx ? x + 1 : x, hx ? y : y + 1, v * NHL.a1);                        // but dans la cage vide
        lead(x, y, v * (1 - NHL.c1 - NHL.a1));

  // ---------- live ----------
  function liveFootball(lh, la, minute, hs, as) {

  }
  function livePoisson(lh, la, prog, hs, as, max) {

    for (var x = 0; x <= max; x++) for (var y = 0; y <= max; y++) {

  function liveTennis(s, sets, bo) {

  // ---------- enjeu ----------
  var DERBIES = [["ARS", "TOT"], ["LFC", "EVE"], ["MCI", "MUN"], ["CFC", "TOT"], ["ARS", "CFC"], ["LFC", "MUN"], ["NEW", "SUN"],
    ["RMA", "ATM"], ["RMA", "BAR"], ["BAR", "ESP"], ["RBB", "SEV"], ["ATH", "RSO"], ["VCF", "VIL"],
    ["INT", "ACM"], ["ROM", "LAZ"], ["JUV", "TOR"], ["INT", "JUV"], ["GEN", "SAM"], ["NAP", "ROM"],

  function isDerby(h, a) { return DERBIES.some(function (d) { return (d[0] === h && d[1] === a) || (d[0] === a && d[1] === h); }); }

  function table(results) {
    var t = {};
    results.forEach(function (r) {
      [r[1], r[2]].forEach(function (c) { if (!t[c]) t[c] = { c: c, pts: 0, gp: 0, gf: 0, ga: 0 }; });
      var H = t[r[1]], A = t[r[2]];
      H.gp++; A.gp++; H.gf += r[3]; H.ga += r[4]; A.gf += r[4]; A.ga += r[3];
      if (r[3] > r[4]) H.pts += 3; else if (r[3] === r[4]) { H.pts++; A.pts++; } else A.pts += 3;

    arr.forEach(function (x, i) { x.rank = i + 1; });

  function ord(n) { return n === 1 ? "1er" : n + "e"; }

  // Lecture du classement par championnat : rel = nombre de places « zone rouge » (0 = pas de relégation au classement),

  var LCONF = {

    brasileirao: { rel: 4, top: 6, txt: "en place pour la Copa Libertadores" }, liga_arg: { noTable: true }

  function stakeLeague(tab, h, a, H, A, compCode) {
    var th = tab.map[h], ta = tab.map[a], cf = LCONF[compCode] || { rel: 3, top: 4, txt: "sur le podium européen" };
    if (!th || !ta || cf.noTable) return isDerby(h, a) ? "Derby" : "";
    var n = tab.n, gp = Math.max(th.gp, ta.gp), parts = [];
    var relLine = cf.rel ? n - cf.rel + 1 : n + 1; // Big 5 : 3 derniers ~ zone rouge/barrage
    if (isDerby(h, a)) parts.push("Derby");
    if (th.rank <= cf.top && ta.rank <= cf.top) parts.push("Choc du haut de tableau (" + ord(th.rank) + " contre " + ord(ta.rank) + ")");
    else if (th.rank >= relLine && ta.rank >= relLine) parts.push("Duel de mal classés (" + ord(th.rank) + " contre " + ord(ta.rank) + ")");

      var d1 = desc(th, H), d2 = desc(ta, A);

  // ---------- combinés ----------
  function buildCombos(cands, targets, maxLegs) {

    var pool = cands.slice().sort(function (a, b) { return b.p - a.p; }).slice(0, 24);
    var used = {}, out = [];
    targets.forEach(function (target) {
      var best = null, ml = (maxLegs && maxLegs[target]) || 4;

  document.addEventListener("focusout", function (e) {
    if (!(e.target.matches && e.target.matches("input[data-xb]"))) return;
    setTimeout(function () { if (!typing() && state.renderLater) { state.renderLater = false; render(); if (state.openKey) openSheet(state.openKey, true); } }, 0);
  });
  $("btn-full").addEventListener("click", function () { fire("full"); });
  $("btn-live").addEventListener("click", function () { fire("live"); });
  setInterval(function () { if (state.loaded) render(); }, 60000);

  renderChips();
  $("btn-full").disabled = true; $("btn-live").disabled = true;

  function showUnavailable() {
    state.loaded = true;
    $("updated").textContent = "Données indisponibles";
    $("main").innerHTML = '<div class="state"><strong>Données indisponibles ici</strong>Les matchs sont stockés dans ton espace claude.ai. Ouvre cette page depuis l\'app Claude, connecté à ton compte.</div>';
  }
  if (WEB) {
    $("actions").style.display = "none";
    var DATA = "data/app.json", busy = false, lastPub = null;
    var applyData = function (d, offline) {
      if (!d || !d.leagues) return false;
      if (!offline && lastPub && d.publishedAt === lastPub && state.loaded && !state.offline) return true;
      lastPub = d.publishedAt || null; state.pubAt = d.publishedAt || null; state.offline = !!offline;
      state.docs = d.leagues || {};
      state.history = (d.history || []).filter(function (x) { return x && ((x.legs && x.legs.length) || x.none); });
      state.live = d.live || null; state.meta = d.meta || {}; state.odds = d.odds || {};
      state.loaded = true; render(); return true;
    };
    var loadData = function () {
      if (busy) return; busy = true;
      var off = false;
      fetch(DATA + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("http " + r.status); off = r.headers.get("x-2odds-offline") === "1"; return r.json(); })
        .then(function (d) { busy = false; if (!applyData(d, off) && !state.loaded) showUnavailableWeb(); })
        .catch(function () {
          busy = false;
          if (window.caches) caches.match(DATA, { ignoreSearch: true }).then(function (r) { return r ? r.json() : null; }).then(function (d) { if (!(d && applyData(d, true)) && !state.loaded) showUnavailableWeb(); else if (state.loaded) { state.offline = true; renderUpdLine(); } }, function () { if (!state.loaded) showUnavailableWeb(); });
          else if (!state.loaded) showUnavailableWeb();
        });
    };
    var showUnavailableWeb = function () {
      state.loaded = true;
      $("updated").textContent = "Données indisponibles";
      $("main").innerHTML = '<div class="state"><strong>Impossible de charger les matchs</strong>Vérifie ta connexion internet, puis réessaie.<div style="margin-top:12px"><button class="xbtoggle" id="retry" type="button">Réessayer</button></div></div>';
      var b = $("retry"); if (b) b.addEventListener("click", function () { state.loaded = false; $("main").innerHTML = '<div class="state"><strong>Chargement des matchs</strong></div>'; loadData(); });
    };
    loadData();
    setInterval(function () { if (!document.hidden) loadData(); }, 5 * 60e3);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) loadData(); });
    window.addEventListener("online", loadData);
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
      navigator.serviceWorker.addEventListener("controllerchange", function () { loadData(); });
    }
    return;
  }
  var api = window.claude;
  if (!api || typeof api.use !== "function") { showUnavailable(); return; }
  api.use("mcp").then(function (mcp) { state.mcp = mcp || null; renderUpdLine(); }, function () { state.mcp = null; renderUpdLine(); });
  api.use("db").then(function (db) {
    if (!db) { showUnavailable(); return; }
    db.collection("leagues").onSnapshot(function (snap) {
      var docs = {};
      snap.docs.forEach(function (d) { if (d.exists) docs[d.id] = d.data(); });
      state.docs = docs; state.loaded = true; render();
    }, function () { showUnavailable(); });
    state.db = db;
    db.collection("odds").onSnapshot(function (snap) {
      var o = {};
      snap.docs.forEach(function (d) { if (d.exists) o[d.id] = d.data(); });
      state.odds = o; if (state.loaded) { render(); if (state.openKey && !typing()) openSheet(state.openKey, true); }
    }, function () {});
    db.collection("history").onSnapshot(function (snap) {
      var h = [];
      snap.docs.forEach(function (d) { if (d.exists) { var x = d.data(); if (!x.id) x.id = d.id; if ((x.legs && x.legs.length) || x.none) h.push(x); } });
      state.history = h; if (state.loaded) render();
    }, function () {});
    db.doc("live/now").onSnapshot(function (s) { state.live = s.exists ? s.data() : null; if (state.loaded) render(); }, function () {});
    db.collection("meta").onSnapshot(function (snap) {
      var m = {}; snap.docs.forEach(function (d) { if (d.exists) m[d.id] = d.data(); });
      state.meta = m; renderUpdLine();
    }, function () {});
  }, showUnavailable);
})();
</script>
